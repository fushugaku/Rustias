name: Publish plugin installers
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/plugins.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the built plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r'project\(RustiasPlugin VERSION ([\d.]+)',Path('plugin/CMakeLists.txt').read_text())[1]
          assert os.environ['RELEASE_TAG']=='v'+version, 'Release tag and binary version differ'
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: Rustias-*-plugins
          merge-multiple: true
          path: release-assets
      - name: Verify all platform installers and write checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assets=Path('release-assets')
          for suffix in ['.pkg','.exe','.deb','.run']:
              assert list(assets.glob('*'+suffix)), 'Missing installer: '+suffix
          files=sorted(p for p in assets.iterdir() if p.is_file())
          (assets/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Rustias $RELEASE_TAG" --notes-file plugin/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
