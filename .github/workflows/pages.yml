name: Publish native WebAssembly synthesizer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Test the firmware-free native profile
        run: >-
          cargo test --locked -p radias-synth-infrastructure --lib --
          --skip generated_catalog_and_tables_equal_the_pinned_system
          --skip instrument_vocoder_replaces_its_pair_and_keeps_other_timbres
          --skip vocoder_source_command_updates_targets_without_resetting_histories
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build WebAssembly and static app
        run: bash scripts/build-web.sh
      - name: Verify audio, sampler, sequencer and storage
        run: node scripts/verify-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
