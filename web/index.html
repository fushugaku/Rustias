<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cbd0d5">
  <meta name="description" content="The complete Rustias native synthesis engine. A full-screen instrument, no firmware required.">
  <title>Rustias · Native synthesizer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="instrument">
    <header class="toolbar">
      <div class="workspace">
        <a class="brand" href="https://github.com/fushugaku/Rustias" aria-label="Rustias source on GitHub">RUSTIAS<span>NATIVE SYNTHESIZER</span></a>
        <div class="timbres" role="tablist" aria-label="Timbre"><button role="tab" aria-selected="true" data-timbre="0">01</button><button role="tab" aria-selected="false" data-timbre="1">02</button><button role="tab" aria-selected="false" data-timbre="2">03</button><button role="tab" aria-selected="false" data-timbre="3">04</button></div>
        <div class="program"><div id="preset"></div><span id="edit-context">Timbre 01</span></div>
        <div class="program-files"><button id="save-patch" class="tool-button">Save</button><a id="save-program" class="tool-button" role="button" href="#" download="rustias-program.json">Export</a><button id="load-program" class="tool-button">Import</button><input id="program-file" type="file" accept=".json,application/json" hidden></div>
      </div>
      <div id="performance" class="performance" aria-label="Performance controls"></div>
      <div class="toolbar-actions"><button id="midi" class="tool-button">MIDI</button><button id="panic" class="tool-button">Stop notes</button><button id="fullscreen" class="tool-button fullscreen" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button id="power" class="power" disabled>Loading…</button></div>
    </header>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="rack" class="rack" aria-label="Complete synthesis panel"></div>
    <section class="sequencer" aria-label="Polyphonic sequencer">
      <div class="sequence-heading"><h2>POLYPHONIC SEQUENCER</h2><div class="sequence-transport"><button id="seq-reset">Reset</button><button id="seq-play" disabled>Play</button></div></div>
      <div class="sequence-scroll"><div id="sequence-tracks"></div></div>
    </section>
    <footer class="performance-footer">
      <div class="keybed">
        <div class="keybed-heading"><span id="keybed-title">KEYBOARD</span><div class="octaves"><button id="octave-down" aria-label="Lower octave">−</button><span id="octave-label">C4–D♯5</span><button id="octave-up" aria-label="Higher octave">+</button></div></div>
        <div id="keys" class="keys" aria-label="Keyboard"></div>
      </div>
      <div class="monitor"><div class="connection"><span id="led" class="led"></span><span id="status" role="status" aria-live="polite">Loading Rust engine…</span></div><div class="monitor-right"><span><b id="voices">0</b> voices</span><meter id="meter" min="0" max="1" value="0" aria-label="Output level"></meter><label class="volume">Volume<input id="volume" type="range" min="0" max="100" value="30"></label><a href="https://github.com/fushugaku/Rustias#webassembly" aria-label="About this build">GitHub ↗</a></div></div>
    </footer>
    <noscript>JavaScript is required to load the WebAssembly synthesizer.</noscript>
  </main>
  <dialog id="step-editor" class="editor-dialog">
    <div class="dialog-heading"><h2 id="step-title"></h2><button id="step-close" aria-label="Close step editor">×</button></div>
    <div class="chord-octaves"><button id="step-octave-down" aria-label="Lower sequence octave">−</button><span id="step-octave"></span><button id="step-octave-up" aria-label="Higher sequence octave">+</button></div>
    <div id="step-notes" class="chord-keyboard"></div><p id="step-selected" class="selected-chord"></p>
    <div class="step-properties"><label>Velocity<input id="step-velocity" type="number" min="1" max="127" value="100"></label><label>Gate %<input id="step-gate" type="number" min="1" max="100" value="75"></label><button id="step-clear">Clear</button><button id="step-copy">Copy next</button></div>
  </dialog>
  <dialog id="patch-editor" class="editor-dialog patch-dialog"><form id="patch-form"><div class="dialog-heading"><h2>Save patch</h2><button id="patch-cancel" type="button" aria-label="Cancel saving patch">×</button></div><label for="patch-name">Name</label><input id="patch-name" type="text" maxlength="64" required><button id="patch-confirm" type="submit">Save patch</button></form></dialog>
</body>
</html>
