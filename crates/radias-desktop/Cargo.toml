[package]
name = "radias-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "radias-desktop"
path = "src/main.rs"

[dependencies]
radias-domain = { path = "../radias-domain" }
radias-application = { path = "../radias-application" }
radias-infrastructure = { path = "../radias-infrastructure", features = ["desktop-io"] }
radias-synth-domain = { path = "../radias-synth-domain" }
radias-synth-application = { path = "../radias-synth-application" }
radias-synth-infrastructure = { path = "../radias-synth-infrastructure", features = ["desktop-io"] }
serde_json = "=1.0.151"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland", "__screenshot"] }
